<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/>
    </marker>
    <style>
      .box{stroke-width:1.5;}
      .lbl{font-size:13px;font-weight:600;fill:#1f2a37;}
      .sub{font-size:10.5px;fill:#4b5563;}
      .stage{font-size:11px;font-weight:700;fill:#6b7280;letter-spacing:.06em;}
      .edge{stroke:#5b6b7b;stroke-width:1.5;fill:none;}
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="470" fill="#ffffff"/>

  <!-- Stage labels -->
  <text x="30" y="40" class="stage">DATA</text>
  <text x="30" y="150" class="stage">PREPROCESSING (leakage-safe, fit on train only)</text>
  <text x="30" y="300" class="stage">MODELING &amp; EVALUATION</text>
  <text x="30" y="430" class="stage">ARTIFACTS</text>

  <!-- DATA -->
  <rect class="box" rx="10" x="30" y="50" width="200" height="70" fill="#eef2ff" stroke="#6366f1"/>
  <text x="46" y="78" class="lbl">data.py</text>
  <text x="46" y="96" class="sub">Real cs-training.csv if present,</text>
  <text x="46" y="110" class="sub">else schema-matched synthetic</text>

  <rect class="box" rx="10" x="260" y="50" width="210" height="70" fill="#eef2ff" stroke="#6366f1"/>
  <text x="276" y="78" class="lbl">config.py — Schema</text>
  <text x="276" y="96" class="sub">Column roles, paths,</text>
  <text x="276" y="110" class="sub">hyperparameters (one place)</text>

  <!-- PREPROCESSING -->
  <rect class="box" rx="10" x="30" y="160" width="270" height="110" fill="#ecfdf5" stroke="#10b981"/>
  <text x="46" y="186" class="lbl">Numeric pipeline</text>
  <text x="46" y="206" class="sub">SimpleImputer (median)</text>
  <text x="46" y="222" class="sub">→ OutlierCapper (winsorize p99)</text>
  <text x="46" y="238" class="sub">→ StandardScaler</text>
  <text x="46" y="258" class="sub">7 continuous financial features</text>

  <rect class="box" rx="10" x="320" y="160" width="290" height="110" fill="#ecfdf5" stroke="#10b981"/>
  <text x="336" y="186" class="lbl">Delinquency pipeline</text>
  <text x="336" y="206" class="sub">SentinelReplacer (96/98 → NaN)</text>
  <text x="336" y="222" class="sub">→ SimpleImputer → domain cap</text>
  <text x="336" y="238" class="sub">→ StandardScaler</text>
  <text x="336" y="258" class="sub">3 past-due count features</text>

  <rect class="box" rx="10" x="630" y="160" width="260" height="110" fill="#f0f9ff" stroke="#0ea5e9"/>
  <text x="646" y="186" class="lbl">ColumnTransformer</text>
  <text x="646" y="206" class="sub">Concatenates both groups into</text>
  <text x="646" y="222" class="sub">a single feature matrix.</text>
  <text x="646" y="238" class="sub">Re-fit inside every CV fold,</text>
  <text x="646" y="258" class="sub">so the test split never leaks.</text>

  <!-- MODELING -->
  <rect class="box" rx="10" x="30" y="312" width="175" height="74" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="46" y="338" class="lbl">Logistic Reg.</text>
  <text x="46" y="356" class="sub">Interpretable baseline,</text>
  <text x="46" y="370" class="sub">class_weight balanced</text>

  <rect class="box" rx="10" x="220" y="312" width="190" height="74" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="236" y="338" class="lbl">Gradient Boosting ★</text>
  <text x="236" y="356" class="sub">HistGBM (XGBoost/LightGBM</text>
  <text x="236" y="370" class="sub">drop-in) — usual winner</text>

  <rect class="box" rx="10" x="425" y="312" width="185" height="74" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="441" y="338" class="lbl">Neural Net (MLP)</text>
  <text x="441" y="356" class="sub">Oversampled at fit;</text>
  <text x="441" y="370" class="sub">PyTorch/skorch drop-in</text>

  <rect class="box" rx="10" x="630" y="312" width="260" height="74" fill="#fef2f2" stroke="#ef4444"/>
  <text x="646" y="338" class="lbl">evaluate.py</text>
  <text x="646" y="356" class="sub">ROC-AUC · PR-AUC · KS ·</text>
  <text x="646" y="370" class="sub">Brier · confusion matrix</text>

  <!-- ARTIFACTS -->
  <rect class="box" rx="10" x="190" y="402" width="180" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="206" y="430" class="lbl" font-size="12">best_model.joblib</text>
  <rect class="box" rx="10" x="385" y="402" width="150" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="401" y="430" class="lbl" font-size="12">metrics.json</text>
  <rect class="box" rx="10" x="550" y="402" width="150" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="566" y="430" class="lbl" font-size="12">report.md</text>
  <rect class="box" rx="10" x="715" y="402" width="175" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="731" y="430" class="lbl" font-size="12">figures/*.png</text>

  <!-- Edges -->
  <path class="edge" d="M130,120 L130,160" marker-end="url(#arrow)"/>
  <path class="edge" d="M455,160 C455,145 465,135 465,120" marker-end="url(#arrow)"/>
  <path class="edge" d="M300,215 L320,215" marker-end="url(#arrow)"/>
  <path class="edge" d="M610,215 L630,215" marker-end="url(#arrow)"/>
  <path class="edge" d="M760,270 L760,300 L117,300 L117,312" marker-end="url(#arrow)"/>
  <path class="edge" d="M760,300 L315,300 L315,312" marker-end="url(#arrow)"/>
  <path class="edge" d="M760,300 L517,300 L517,312" marker-end="url(#arrow)"/>
  <path class="edge" d="M610,349 L630,349" marker-end="url(#arrow)"/>
  <path class="edge" d="M760,386 L760,402" marker-end="url(#arrow)"/>
</svg>
